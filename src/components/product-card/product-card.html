<article
  class="card"
  [class.selected]="selected"
  [class.bought]="bought"
  [class.out-of-stock]="isOutOfStock()"
>
  <div class="image-wrapper">
    <img
      [src]="product.thumbnail"
      [alt]="product.title"
      appImageZoom
      loading="lazy"
    />
    @if (bought) {
      <span class="bought-badge" aria-label="Already purchased">Purchased</span>
    }
  </div>

  <div class="content">
    <h2 class="title">{{ product.title }}</h2>
    <p class="price">${{ product.price.toFixed(2) }}</p>

    <p
      class="stock"
      [class.out]="isOutOfStock()"
      [attr.aria-label]="
        isOutOfStock()
          ? 'Out of stock'
          : 'In stock, ' + product.stock + ' available'
      "
    >
      {{ isOutOfStock() ? 'Out of stock' : 'In stock: ' + product.stock }}
    </p>

    <p class="description">
      {{
        showFull
          ? product.description
          : (product.description | truncateWords: 3)
      }}
    </p>
    <button
      type="button"
      class="see-more"
      (click)="toggleDescription()"
      [attr.aria-expanded]="showFull"
    >
      {{ showFull ? 'See less' : 'See all description' }}
    </button>
  </div>

  <div class="actions">
    <label class="select">
      <input
        type="checkbox"
        [checked]="selected"
        (change)="onCheckboxChange($event)"
        [attr.aria-label]="'Select ' + product.title"
      />
      <span>Select</span>
    </label>

    <button
      type="button"
      class="buy-btn"
      (click)="onBuy()"
      [disabled]="isOutOfStock() || bought"
    >
      {{ bought ? 'Bought' : 'Buy' }}
    </button>
  </div>
</article>
